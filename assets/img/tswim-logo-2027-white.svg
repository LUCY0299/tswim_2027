<svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Circle Badge with shadow -->
  <g filter="url(#shadow)">
    <circle cx="45" cy="50" r="38" fill="none" stroke="white" stroke-width="2.5"/>

    <!-- Inner decorative circle -->
    <circle cx="45" cy="50" r="33" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- TSWIM text -->
  <text x="45" y="52" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
    TSWIM
  </text>

  <!-- 2027 year -->
  <text x="45" y="68" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle" filter="url(#shadow)">
    2027
  </text>

  <!-- Right side text -->
  <text x="105" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="white" filter="url(#shadow)">
    TSWIM 2027
  </text>

  <text x="105" y="54" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="500" fill="white" filter="url(#shadow)">
    Taiwan Summer Workshop
  </text>

  <text x="105" y="65" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="500" fill="white" filter="url(#shadow)">
    on Information Management
  </text>

  <!-- Decorative line -->
  <line x1="88" y1="25" x2="88" y2="75" stroke="white" stroke-width="1.5" opacity="0.4" filter="url(#shadow)"/>
</svg>
